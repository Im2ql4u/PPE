[project]
name = "ppe-research"
version = "0.0.0"
description = "Research experiments for a computational piano learning laboratory (not the application)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "music21>=10.5",
    "partitura>=1.9",
    "ms3>=2.6",
    # 6.3.0 drops key-signature-implied accidentals on **kern import (F# -> F in MIDI/pitch);
    # 4.5.1-6.2.0 are correct. See experiments/e1_render_and_address/README.md.
    "verovio>=6.2,<6.3",
    "mido>=1.3",
    "pretty_midi>=0.2.11",
    "numpy",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "tabulate>=0.10.0",
]
# Heavier, optional research stacks; install with `uv sync --group align` etc.
align = ["parangonar>=3.4"]

[tool.uv]
package = false
