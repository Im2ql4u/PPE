[project]
name = "ppe-research"
version = "0.0.0"
description = "Research experiments for a computational piano learning laboratory (not the application)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "music21>=10.5",
    "partitura>=1.9",
    "ms3>=2.6",
    "verovio>=6.3",
    "mido>=1.3",
    "pretty_midi>=0.2.11",
    "numpy",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]
# Heavier, optional research stacks; install with `uv sync --group align` etc.
align = ["parangonar>=3.4"]

[tool.uv]
package = false
